services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: health_skill_test
      POSTGRES_USER: health_skill_test
      POSTGRES_PASSWORD: local-test-only
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U health_skill_test -d health_skill_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
